# The dsh-memory bundle patch. One insert row over the empty profile root.
# Users may override any config value by re-addressing row `memory` in their
# own `$DSH_HOME/cordis.patch.yml` (last write wins per row).

- insert:
    - id: memory
      name: 'dsh-memory-notes'
      config:
        memoryDir: ''
        maxBytes: 16384
        maxFiles: 24
